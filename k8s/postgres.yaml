apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: contact-app
type: Opaque
stringData:
  POSTGRES_DB: contacts
  POSTGRES_USER: contacts_user
  POSTGRES_PASSWORD: Amol@321
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: contact-app
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: contact-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          envFrom: [{ secretRef: { name: postgres-secret } }]
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe:
            exec: { command: [sh, -c, 'pg_isready -U contacts_user -d contacts'] }
          livenessProbe:
            exec: { command: [sh, -c, 'pg_isready -U contacts_user -d contacts'] }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: contact-app
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
